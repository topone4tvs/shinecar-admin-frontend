<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #E6436E; }
  svg { display: block; }
</style>
</head>
<body>
<!-- 用于导出 PNG 的满版图标；?size=1024 控制边长 -->
<svg id="s" width="1024" height="1024" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" fill="#E6436E"/>
  <g stroke="#FFFFFF" fill="none">
    <circle cx="120" cy="120" r="55" stroke-width="17"/>
    <g stroke-width="12.5" stroke-linecap="round">
    <line x1="138.6" y1="133.5" x2="157.2" y2="147.0"/>
    <line x1="112.9" y1="141.9" x2="105.8" y2="163.7"/>
    <line x1="97.0" y1="120.0" x2="74.0" y2="120.0"/>
    <line x1="112.9" y1="98.1" x2="105.8" y2="76.3"/>
    <line x1="138.6" y1="106.5" x2="157.2" y2="93.0"/>
    </g>
  </g>
  <circle cx="120" cy="120" r="12.5" fill="#FFFFFF"/>
</svg>
<script>
  const n = Number(new URLSearchParams(location.search).get('size')) || 1024;
  const s = document.getElementById('s');
  s.setAttribute('width', n);
  s.setAttribute('height', n);
</script>
</body>
</html>
